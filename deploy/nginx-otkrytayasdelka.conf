# Nginx для otkrytayasdelka.kg — TLS и прокси на Django (порт 8000).
# Сертификат: /etc/letsencrypt/live/otkrytayasdelka.kg/
# Продление: certbot renew (webroot /var/www/html, location /.well-known/acme-challenge/).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name otkrytayasdelka.kg www.otkrytayasdelka.kg _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://otkrytayasdelka.kg$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.otkrytayasdelka.kg;
    ssl_certificate /etc/letsencrypt/live/otkrytayasdelka.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otkrytayasdelka.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://otkrytayasdelka.kg$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name otkrytayasdelka.kg;
    client_max_body_size 320M;
    ssl_certificate /etc/letsencrypt/live/otkrytayasdelka.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otkrytayasdelka.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /static/ {
        alias /opt/otkrytayasdelka/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /media/ {
        alias /opt/otkrytayasdelka/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
