# Docker Compose для деплоя «Открытая Сделка»
# Запуск: docker compose up -d
# Сборка: docker compose build
# БД и медиа вне образа — см. deploy/README.md (SQLite в ./data, Postgres при DATABASE_URL).
#
# Секреты: только через .env / secrets (не коммитьте .env). Отдельный DATABASE_URL для preview/staging.
# PostgreSQL: не пробрасывайте порт БД в интернет; сервис db без ports: или только internal network.

services:
  web:
    build: .
    container_name: otkrytaya-sdelka-web
    restart: unless-stopped
    ports:
      # Только localhost: снаружи отдаёт nginx (80/443). Не публикуйте Gunicorn в интернет.
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2560M
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - DJANGO_MEDIA_ROOT=/app/media
    volumes:
      # Персистентные данные на хосте (nginx может отдавать static/media напрямую)
      - ./data:/app/data
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    # При забитых воркерах connect к :8000 может висеть >3s → TimeoutError и вечный unhealthy.
    # timeout в HTTPConnection — запас на connect+ответ; timeout в compose — лимит на всю CMD.
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1', 8000, timeout=20); c.request('GET', '/healthz'); r=c.getresponse(); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 300s

  # Telegram-бот загрузки объектов (long polling, входящие порты не нужны).
  # Нужен TELEGRAM_BOT_TOKEN в .env. Пишет в ту же БД и media, что и сайт.
  bot:
    build: .
    container_name: otkrytaya-sdelka-bot
    restart: unless-stopped
    command: ["python", "manage.py", "run_telegram_bot"]
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - DJANGO_MEDIA_ROOT=/app/media
      - RUN_MIGRATIONS=0
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    # Даём боту дождаться конца текущего long poll и подтвердить обработанные сообщения.
    stop_grace_period: 40s
